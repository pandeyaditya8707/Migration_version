name: CI Pipeline

on:
  push:
    branches: [ "main", "v2" ]
  pull_request:
    branches: [ "main", "v2" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest-randomly pytest-cov

    - name: Run Ruff Linting
      run: |
        ruff check backend/

    - name: Run Hermetic Pytest Suite (Order-Independent)
      env:
        PYTHONPATH: backend
      run: |
        pytest backend/tests/ -m "not playwright" --ignore=backend/tests/test_playwright_ui.py --randomly-seed=1234
        pytest backend/tests/ -m "not playwright" --ignore=backend/tests/test_playwright_ui.py --randomly-seed=9999
